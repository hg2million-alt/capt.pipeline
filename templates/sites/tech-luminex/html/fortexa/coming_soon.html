<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/shishirraven/animate-on-scroll@v1.2/animation_utility.css" />
    <link rel="icon" type="image/x-icon" href="image/favicon.png" />
    <title>[NOME DO CLIENTE] — Cibersegurança</title>
</head>

<body>
    <!-- Main -->
    <main>
        <!-- Section Banner -->
        <div class="section bg-banner">
            <div class="container-banner flex-column align-items-center text-center gap-5">
                <h1 class="scrollanimation animated fadeInUp adr-5">Securing The Future, <br>
                    <span class="text-accent">Coming Soon</span>
                </h1>
                <p class="scrollanimation animated fadeInUp adr-5 adl-1" style="max-width: 480px;">
                    Our next-generation protection platform is on the way to keep your business ahead of cyber threats.
                </p>
                <div class="d-flex flex-xl-row flex-column gap-3 countdown">
                    <div class="card-coming">
                        <h3 id="days">0</h3>
                        <p>Days</p>
                    </div>
                    <div class="card-coming">
                        <h3 id="hours">0</h3>
                        <p>Hours</p>
                    </div>
                    <div class="card-coming">
                        <h3 id="minutes">0</h3>
                        <p>Minutes</p>
                    </div>
                    <div class="card-coming">
                        <h3 id="seconds">0</h3>
                        <p>Seconds</p>
                    </div>
                </div>
                <div class="elipse banner"></div>
                <div class="elipse banner-2"></div>
            </div>

        </div>
        <!-- End Banner -->
    </main>

    <!-- Scripts -->
    <script src=" js/vendor/jquery.min.js"></script>
    <script src="js/vendor/bootstrap.bundle.min.js"></script>
    <script src="js/vendor/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/swiper-script.js"></script>
    <script src="js/submit-form.js"></script>
    <script src="js/vendor/isotope.pkgd.min.js"></script>
    <script src="js/video_embedded.js"></script>
    <script src="js/vendor/fslightbox.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/shishirraven/animate-on-scroll@v1.0/oyethemes_onscroll_animation.js"></script>
</body>

</html>
