<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="image/favicon.png">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css" />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/shishirraven/animate-on-scroll@v1.2/animation_utility.css" />
    <title>[NOME DO CLIENTE] — Consultoria de TI</title>
</head>

<body>
    <!-- Main -->
    <main>
        <!-- Hero -->
        <div class="wrapper-coming">
            <div class="d-flex flex-column align-items-center gap-3 text-center p-5">
                <h3 class="scrollanimation animated fadeInUp adr-5">
                    <span class="text-accent">The Next Chapter of Visora Is Loading...</span>
                </h3>
                <p class="scrollanimation animated fadeInUp adr-5 adl-1">
                    Exciting updates are on the horizon. Get ready for enhanced services and a refreshed online
                    experience.
                </p>
                <form class="needs-validation form coming w-100 scrollanimation animated fadeInUp adr-5 adl-2"
                    novalidate>
                    <input type="text" name="action" value="subscribe" hidden>
                    <div class="input-group">
                        <input type="email" class="form-control footer" placeholder="Enter E-mail Address" name="email"
                            required>
                        <button class="btn btn-accent orange submit_subscribe position-relative px-4 py-3"
                            type="submit">
                            <span>Contact Us</span>
                            <span class="gradient-container">
                                <span class="gradient"></span>
                            </span>
                            <div class="invalid-feedback text-white">
                                Please provide a valid email format (e.g.,
                                user@example.com).
                            </div>
                        </button>
                    </div>
                </form>
            </div>
            <div class="circle-gradient-stack coming"></div>
            <div class="circle-gradient-stack coming-2"></div>
        </div>
        <!-- End Hero -->
    </main>
    <!-- End Main -->

    <!-- Scripts -->
    <script src=" js/vendor/bootstrap.bundle.min.js">
    </script>
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/vendor/swiper-bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/swiper-script.js"></script>
    <script src="js/submit-form.js"></script>
    <script src="js/vendor/isotope.pkgd.min.js"></script>
    <script src="js/video_embedded.js"></script>
    <script src="https://kit.fontawesome.com/a6df7668b8.js" crossorigin="anonymous"></script>
    <script src=" js/vendor/fslightbox.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/shishirraven/animate-on-scroll@v1.0/oyethemes_onscroll_animation.js"></script>
</body>

</html>
